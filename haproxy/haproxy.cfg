global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend kubernetes_api
    bind *:7443
    default_backend kubernetes_control_planes

backend kubernetes_control_planes
    balance roundrobin
    option tcp-check
    default-server inter 3s fall 3 rise 2
    server cp1 192.168.150.110:6443 check
    server cp2 192.168.150.111:6443 check
    server cp3 192.168.150.112:6443 check